# The app name is not stored here: deploy with `fly deploy -a "$FLY_APP"`.
# Runtime configuration and credentials are Fly secrets (DATABASE_URL for the easyshot_app
# role, MIGRATION_DATABASE_URL for the owner, CRON_SECRET, PUBLIC_BASE_URL, WEB_SECRET and the
# Tigris variables), synced from GitHub secrets by CI. PostgreSQL: Fly Managed Postgres or Neon.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrations run as the owner role before new machines start.
  release_command = "migrate up"

[env]
  BIND_ADDR = "0.0.0.0:8080"
  RUST_LOG = "info"
  TRUSTED_PROXY_HOPS = "1"
  # PlanetScale migration login inherits postgres; migrate as postgres so it owns every object.
  MIGRATION_ROLE = "postgres"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
