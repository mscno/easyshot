[package]
name = "shotglass-server"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "shotglass_server"
path = "src/lib.rs"

[[bin]]
name = "shotglass-server"
path = "src/main.rs"

[features]
default = []
lambda = ["dep:lambda_http"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
libsql = { version = "0.10", default-features = false, features = ["core", "remote", "tls"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
subtle = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
lambda_http = { version = "1", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
