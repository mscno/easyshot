# Local dev dependencies: Postgres + MinIO (+ bucket creation).
# Run the server on the host with `cargo run` (see .env.example), or `docker compose --profile app up --build`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shotglass
      POSTGRES_PASSWORD: shotglass
      POSTGRES_DB: shotglass
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotglass"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/shotglass &&
      mc ilm rule add --expire-days 31 local/shotglass || true"

  server:
    profiles: ["app"]
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://shotglass:shotglass@postgres:5432/shotglass
      PUBLIC_BASE_URL: http://localhost:8080
      S3_BUCKET: shotglass
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      CRON_SECRET: dev-cron-secret

volumes:
  pgdata:
  miniodata:
