# Local dev dependencies: MinIO (+ bucket creation), and optionally PostgreSQL.
# The usual setup uses a local PostgreSQL 18 on :5433 and `mise run server:dev` (see README).
#   docker compose up -d minio minio-init
# Everything in containers, including PostgreSQL:
#   docker compose --profile postgres --profile app up --build
services:
  postgres:
    profiles: ["postgres"]
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easyshot_dev
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/easyshot &&
      mc ilm rule add --expire-days 31 local/easyshot || true"

  server:
    profiles: ["app"]
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["8080:8080"]
    environment:
      # Migrations as the owner at startup; the server itself connects as easyshot_app.
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@postgres:5432/easyshot_dev
      DATABASE_URL: postgres://easyshot_app:easyshot_app@postgres:5432/easyshot_dev
      RUN_MIGRATIONS: "true"
      PUBLIC_BASE_URL: http://localhost:8080
      S3_BUCKET: easyshot
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      CRON_SECRET: dev-cron-secret
      WEB_SECRET: dev-web-secret

volumes:
  pgdata:
  miniodata:
