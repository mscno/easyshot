name: Release signed DMG
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Also create a versioned draft GitHub release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: easyshot-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-26
    timeout-minutes: 210
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check release version and tools
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_DRAFT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.create_draft_release }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$CREATE_DRAFT_RELEASE" == true ]]; then
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
               gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Release/tag v$VERSION already exists. Bump Resources/Info.plist for a new draft release." >&2
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf 'version=%s\nartifact_name=Easyshot-%s-AppleSilicon\n' "$VERSION" "$VERSION" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          [[ "$(uname -m)" == arm64 ]]
          python3 -m pip install 'dmgbuild==1.6.7'
      - name: Unit tests
        run: |
          swift test --arch arm64
          python3 -m unittest discover -s Tests/Release -v
      - name: Import signing and notarization credentials
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12_BASE64:?Missing certificate secret}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password secret}"
          : "${SIGNING_IDENTITY:?Missing signing identity secret}"
          : "${NOTARY_API_KEY_BASE64:?Missing notarization API key secret}"
          : "${NOTARY_KEY_ID:?Missing API key ID secret}"
          : "${NOTARY_ISSUER_ID:?Missing API issuer ID secret}"
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/easyshot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/easyshot-signing.p12"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/easyshot-notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 14400 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$RUNNER_TEMP/easyshot-signing.p12" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          xcrun notarytool store-credentials shotglass --keychain "$KEYCHAIN_PATH" --key "$RUNNER_TEMP/easyshot-notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          printf 'SIGNING_KEYCHAIN=%s\nNOTARY_KEYCHAIN=%s\nNOTARY_PROFILE=shotglass\n' "$KEYCHAIN_PATH" "$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Sign, notarize, staple and build DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_TIMEOUT: 90m
          EASYSHOT_CLOUD_URL: ${{ secrets.SHOTGLASS_API_URL }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing Sparkle signing key}"
          umask 077
          export SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          trap 'rm -f "$SPARKLE_KEY_FILE"' EXIT
          bash scripts/release.sh
      - name: Upload signed and notarized DMG
        id: dmg
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/release/Easyshot-*-AppleSilicon.dmg
            dist/release/SHA256SUMS.txt
            dist/release/appcast.xml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Link downloadable artifact
        env:
          ARTIFACT_URL: ${{ steps.dmg.outputs.artifact-url }}
        run: |
          printf '[Download signed and notarized Apple Silicon DMG](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Save notarization diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: notarization-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/*-notarization-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Delete temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/easyshot-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/easyshot-signing.p12" "$RUNNER_TEMP/easyshot-notary.p8"
  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft_release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified DMG
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.artifact_name }}
          path: dist/release
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download the Apple Silicon DMG, open it, and drag Easyshot into Applications.
          Requires macOS 26 or later. Signed with Developer ID and notarized by Apple.
          Screen Recording permission is requested when you capture; camera/microphone access is optional.
          NOTES
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'The release tag was created during this build; refusing to publish mismatched artifacts.' >&2
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" "dist/release/Easyshot-$RELEASE_VERSION-AppleSilicon.dmg" dist/release/SHA256SUMS.txt dist/release/appcast.xml --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Easyshot $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
